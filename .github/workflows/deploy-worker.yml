name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/deploy-worker.yml'
  pull_request:
    paths:
      - 'worker/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: worker/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Cloudflare configuration
        env:
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          for variable in D1_DATABASE_NAME D1_DATABASE_ID R2_BUCKET_NAME CLOUDFLARE_API_TOKEN; do
            if [ -z "${!variable}" ]; then
              echo "::error::Missing GitHub Actions variable or secret: $variable"
              exit 1
            fi
          done

      - name: Generate wrangler.toml
        run: |
          cat > wrangler.toml <<'EOF'
          name = "resource-proxy"
          main = "src/index.js"
          compatibility_date = "2026-07-24"

          [[d1_databases]]
          binding = "DB"
          database_name = "${{ vars.D1_DATABASE_NAME }}"
          database_id = "${{ vars.D1_DATABASE_ID }}"

          [[r2_buckets]]
          binding = "CACHE_BUCKET"
          bucket_name = "${{ vars.R2_BUCKET_NAME }}"
          EOF

          if [ -n "${{ vars.ROUTE_PATTERN }}" ]; then
            cat >> wrangler.toml <<'EOF'

          [[routes]]
          pattern = "${{ vars.ROUTE_PATTERN }}"
          custom_domain = true
          EOF
          fi

          cat >> wrangler.toml <<'EOF'

          [vars]
          DEFAULT_TTL = "${{ vars.DEFAULT_TTL }}"
          MAX_CACHE_SIZE = "${{ vars.MAX_CACHE_SIZE }}"
          R2_MAX_STORAGE_BYTES = "${{ vars.R2_MAX_STORAGE_BYTES }}"
          ORIGIN_ALLOWLIST = "${{ vars.ORIGIN_ALLOWLIST }}"
          ADMIN_ORIGINS = "${{ vars.ADMIN_ORIGINS }}"
          EOF

      - name: Apply D1 migrations
        if: github.ref == 'refs/heads/main'
        run: |
          cat > d1-migrations.wrangler.toml <<EOF
          name = "resource-cache-migrations"
          compatibility_date = "2026-07-24"

          [[d1_databases]]
          binding = "DB"
          database_name = "$D1_DATABASE_NAME"
          database_id = "$D1_DATABASE_ID"
          EOF
          npx wrangler d1 migrations apply "$D1_DATABASE_NAME" --remote --config d1-migrations.wrangler.toml
        env:
          D1_DATABASE_NAME: ${{ vars.D1_DATABASE_NAME }}
          D1_DATABASE_ID: ${{ vars.D1_DATABASE_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main'
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Dry run deploy
        if: github.ref != 'refs/heads/main'
        run: npx wrangler deploy --dry-run
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

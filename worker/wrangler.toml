name = "resource-proxy"
main = "src/index.js"
compatibility_date = "2026-07-24"

[[d1_databases]]
binding = "DB"
database_name = "resource-cache-db"
database_id = "your-database-id"

[[r2_buckets]]
binding = "CACHE_BUCKET"
bucket_name = "resource-cache"

[[routes]]
pattern = "cdn.yourdomain.com/*"
custom_domain = true

[vars]
DEFAULT_TTL = "604800"
MAX_CACHE_SIZE = "104857600"
